# Agent Scratchpad: Win+S mostra/esconde os agentes numa janela flutuante.
# As alterações aplicam-se logo ao gravar (o command só na próxima sessão).

# Agentes: nome | comando. O primeiro abre no Win+S; os outros escolhem-se no menu do Win+Enter.
# Exemplos de comandos: claude --continue · cmd /c codex (agentes npm são .cmd e precisam do cmd /c)
agent=Claude Code | claude
agent=Grok | grok

# Pasta onde o agente arranca
workdir=C:\

# Borda de onde a janela desliza e onde fica encostada: top, bottom, left, right
edge=top

# Tamanho, em fração da área do ecrã (0.1 a 1.0). Com 2+ painéis a largura passa a width_split.
width=0.70
height=0.70
width_split=0.90

# Espaço entre a janela e a borda, em píxeis
margin=12

# Duração do deslizar em milissegundos (0 = sem animação)
animation_ms=220

# Quanto escurece o resto do ecrã (0 = nada, 0.9 = quase preto)
dim=0.35

# Material do fundo:
#   blur     fotografia desfocada do ecrã por trás (parece acrylic e não muda ao deslizar)
#   acrylic  o acrylic do Windows (fica mais claro enquanto a janela se move)
#   mica, tabbed, none
backdrop=blur

# Agentes que pintam o seu próprio fundo (ex.: o Grok, quase preto): auto torna essa cor
# transparente, para todos ficarem com o mesmo fundo da janela. off mostra a cor do agente.
transparent_bg=auto

# Escurecer o fundo da própria janela, para dar contraste ao texto (0 a 1)
tint=0.35

# Cantos: round, small, square. Linha à volta: none, default ou uma cor #RRGGBB
corners=round
border=none

# Letra (a primeira que existir) e tamanho em pontos
font=Cascadia Mono, Consolas
font_size=12

# Espaço entre o texto e a borda da janela
padding=14

# Esconder ao clicar fora ou ao mudar de app (Alt+Tab)
hide_on_blur=true
